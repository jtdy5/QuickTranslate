name: iOS Unsigned IPA Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["iOS Simulator Build"]
    types: [completed]

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch OnscreenTranslator app icon
        run: |
          mkdir -p QuickTranslate/Assets.xcassets/AppIcon.appiconset
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/yeshengliu/OnscreenTranslator/4d54d1025b4ba05c7b91194468ff9c302dd813fb/OnscreenTranslator/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" \
            -o QuickTranslate/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iPhone (unsigned)
        run: |
          xcodebuild \
            -project QuickTranslate.xcodeproj \
            -scheme QuickTranslate \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/QuickTranslate.app"
          test -d "$APP_PATH"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/QuickTranslate.app
          cd ipa
          /usr/bin/zip -r -y ../QuickTranslate-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuickTranslate-unsigned-IPA
          path: QuickTranslate-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
