name: iOS Simulator Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OnscreenTranslator app icon
        run: |
          mkdir -p QuickTranslate/Assets.xcassets/AppIcon.appiconset
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/yeshengliu/OnscreenTranslator/4d54d1025b4ba05c7b91194468ff9c302dd813fb/OnscreenTranslator/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" \
            -o QuickTranslate/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project QuickTranslate.xcodeproj \
            -scheme QuickTranslate \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r QuickTranslate-Simulator.zip QuickTranslate.app
      - uses: actions/upload-artifact@v4
        with:
          name: QuickTranslate-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/QuickTranslate-Simulator.zip
