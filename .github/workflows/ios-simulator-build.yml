name: iOS Simulator Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project QuickTranslate.xcodeproj \
            -scheme QuickTranslate \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r QuickTranslate-Simulator.zip QuickTranslate.app
      - uses: actions/upload-artifact@v4
        with:
          name: QuickTranslate-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/QuickTranslate-Simulator.zip
